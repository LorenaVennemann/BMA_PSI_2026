<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Camera</title>
<style>
body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
button { font-size: 1.1rem; padding: .8rem 1.4rem; margin: .4rem; border: none; border-radius: 8px; cursor: pointer; }
.on { background: #2e7d32; color: #fff; }
.off { background: #c62828; color: #fff; }
.photo { background: #1565c0; color: #fff; }
.analyze { background: #6a1b9a; color: #fff; }
img { max-width: 100%; margin-top: 1rem; border-radius: 8px; }
pre { text-align: left; background: #f0f0f0; padding: 1rem; border-radius: 8px; }
</style>
</head>
<body>
<h1>LED Camera</h1>
<p>LED status: <strong id="status">?</strong></p>
<input type="color" id="color" value="#ffffff">
<br>
<button class="on" onclick="ledOn()">LED on</button>
<button class="off" onclick="ledOff()">LED off</button>
<br>
<label>Brightness: <input type="range" id="bright" min="0" max="255" value="150" oninput="setBright(this.value)"></label>
<span id="brightval">150</span>
<br>
<label>Shutter: <input type="number" id="shutter" value="8000"></label><br>
<label>Gain: <input type="number" id="gain" step="0.1" value="1.5"></label><br>
<label>EV: <input type="number" id="ev" value="-0.3" step="0.5"></label>
<br>
<button class="photo" onclick="takePhoto()">Take photo</button>
<br>
<input type="file" id="fileInput" accept="image/*">
<button class="analyze" onclick="uploadAnalyze()">Upload & Analyze</button>
<button class="analyze" onclick="analyze()">Analyze</button>
<button class="analyze" onclick="cornerCheck()">Egg-Analyse</button>
<button class="photo" onclick="toggleStream()">Live-Video</button>
<p id="msg"></p>
<img id="stream" style="display:none;">
<img id="img">
<pre id="result"></pre>
<img id="overlay">
<h2 style="margin-top:2rem;">Terminal</h2>
<iframe id="term" style="width:100%; height:400px; border:1px solid #ccc; border-radius:8px;"></iframe>
<script>
async function uploadAnalyze() {
  const f = document.getElementById('fileInput').files[0];
  if (!f) { alert('Bitte zuerst ein Bild wählen'); return; }
  document.getElementById('result').textContent = 'Uploading & analyzing...';
  const fd = new FormData();
  fd.append('file', f);
  const res = await fetch('/api/upload', { method: 'POST', body: fd });
  const data = await res.json();
  if (data.error) { document.getElementById('result').textContent = 'Error: ' + data.error; return; }
  document.getElementById('result').textContent = JSON.stringify(data.result, null, 2);
  document.getElementById('overlay').src = data.overlay + '?t=' + Date.now();
}
const status = document.getElementById('status');
const msg = document.getElementById('msg');
async function ledOn() {
  const hex = document.getElementById('color').value;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const res = await fetch('/api/led/on',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({r,g,b})});
  status.textContent = (await res.json()).led;
}
async function ledOff() {
  const res = await fetch('/api/led/off',{method:'POST'});
  status.textContent = (await res.json()).led;
}
async function setBright(v) {
  document.getElementById('brightval').textContent = v;
  await fetch('/api/led/bright',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:v})});
}
async function takePhoto() {
  msg.textContent = 'Taking photo...';
  const shutter = document.getElementById('shutter').value;
  const gain = document.getElementById('gain').value;
  const ev = document.getElementById('ev').value;
  const res = await fetch('/api/photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shutter,gain,ev})});
  const data = await res.json();
  if (data.error) { msg.textContent = 'Error: ' + data.error; return; }
  document.getElementById('img').src = data.url;
  const rawUrl = data.url.replace('.jpg','.dng');
  const sharpTxt = data.sharpness != null ? ' | Schaerfe: ' + data.sharpness + '%' : '';
  msg.innerHTML = '<a href="' + rawUrl + '" download>Download RAW</a>' + sharpTxt;
}
async function analyze() {
  document.getElementById('result').textContent = 'Analyzing...';
  const res = await fetch('/api/analyze',{method:'POST'});
  const data = await res.json();
  if (data.error) { document.getElementById('result').textContent = 'Error: ' + data.error; return; }
  document.getElementById('result').textContent = JSON.stringify(data.result, null, 2);
  document.getElementById('overlay').src = data.overlay + '?t=' + Date.now();
}

async function cornerCheck() {
  document.getElementById('result').textContent = 'Egg-Analyse...';
  const res = await fetch('/api/corner', { method: 'POST' });
  const data = await res.json();
  if (data.error) { document.getElementById('result').textContent = 'Error: ' + data.error; return; }
  document.getElementById('result').textContent = JSON.stringify(data.result, null, 2);
  document.getElementById('overlay').src = data.overlay + '?t=' + Date.now();
}

let streaming = false;
function toggleStream() {
  const el = document.getElementById('stream');
  if (!streaming) { el.src = '/stream?' + Date.now(); el.style.display = 'block'; streaming = true; }
  else { el.src = ''; el.style.display = 'none'; streaming = false; }
}
document.getElementById('term').src = 'http://' + location.hostname + ':7681';
fetch('/api/led').then(r => r.json()).then(d => status.textContent = d.led);
</script>
</body>
</html>
